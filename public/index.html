<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure License Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Inter,system-ui,Arial;color:#161823}
.card{width:min(420px,92vw);background:#fff;border:1px solid #e8ebf0;border-radius:22px;padding:28px;box-shadow:0 18px 50px #1111}
h1{margin:0 0 8px;font-size:25px}p{color:#737985;font-size:14px;margin:0 0 22px}
input{width:100%;padding:13px 14px;margin:7px 0;border:1px solid #dfe3e8;border-radius:12px;font-size:15px;outline:none}
input:focus{border-color:#fe2c55}
button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;background:#fe2c55;color:white;font-weight:700;font-size:15px;cursor:pointer}
#msg{min-height:20px;margin-top:14px;font-size:13px}
.hidden{display:none}.info{background:#f7f8fa;border-radius:14px;padding:15px;margin-top:18px;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <h1>License Login</h1>
  <p>Enter your account credentials to continue.</p>

  <div id="loginBox">
    <input id="username" autocomplete="username" placeholder="Username">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button onclick="login()">Log in</button>
    <div id="msg"></div>
  </div>

  <div id="accountBox" class="hidden">
    <strong>Authenticated</strong>
    <div class="info" id="accountInfo"></div>
    <button onclick="logout()">Log out</button>
  </div>
</div>

<script>
const TOKEN_KEY = "license_session_token";

async function login(){
  const msg = document.getElementById("msg");
  msg.textContent = "Signing in...";
  try{
    const r = await fetch("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:document.getElementById("username").value,
        password:document.getElementById("password").value
      })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Login failed");

    localStorage.setItem(TOKEN_KEY,data.token);
    showAccount(data.user);
  }catch(e){
    msg.textContent = e.message;
  }
}

function showAccount(u){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("accountBox").classList.remove("hidden");
  document.getElementById("accountInfo").innerHTML =
    "<b>Username:</b> "+escapeHtml(u.username)+"<br>"+
    "<b>Expires:</b> "+escapeHtml(new Date(u.expiresAt).toLocaleString())+"<br>"+
    "<b>Status:</b> "+(u.active && !u.expired ? "Active" : "Expired/Disabled");
}

async function checkSession(){
  const token=localStorage.getItem(TOKEN_KEY);
  if(!token) return;
  const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}});
  if(r.ok){
    const d=await r.json();
    showAccount(d.user);
  }else{
    localStorage.removeItem(TOKEN_KEY);
  }
}

function logout(){
  localStorage.removeItem(TOKEN_KEY);
  location.reload();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
checkSession();
</script>
</body>
</html>
